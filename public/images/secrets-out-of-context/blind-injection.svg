<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#cfae70" stroke-width="1.4"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#e06c60" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1400" height="640" fill="#0a0a0d"/>

  <text x="700" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#f0ebe1">Blind injection, one pipeline</text>
  <text x="700" y="108" text-anchor="middle" font-size="19" fill="#9c9cab">the model sees a placeholder; the plaintext lives only inside the pipe</text>

  <!-- model box -->
  <rect x="60" y="200" width="280" height="170" rx="10" fill="#13131c" stroke="#24242f" stroke-width="1.5"/>
  <text x="85" y="245" font-family="Georgia, serif" font-size="26" fill="#e8d5ac">Agent</text>
  <text x="85" y="280" font-size="15" fill="#9c9cab">emits a command</text>
  <rect x="85" y="300" width="230" height="44" rx="6" fill="#0a0a0d" stroke="#cfae70" stroke-width="1.3"/>
  <text x="98" y="328" font-size="14" fill="#cfae70">vault get {{id}} | edit | ok</text>

  <!-- wrapper box -->
  <rect x="470" y="200" width="360" height="170" rx="10" fill="#13131c" stroke="#cfae70" stroke-width="1.8"/>
  <text x="495" y="245" font-family="Georgia, serif" font-size="26" fill="#e8d5ac">Trusted wrapper</text>
  <text x="495" y="280" font-size="15" fill="#9c9cab">fetches, edits, writes back in one pipe</text>
  <text x="495" y="308" font-size="15" fill="#9c9cab">plaintext never leaves this box</text>
  <text x="495" y="340" font-size="15" fill="#cfae70">deny rule blocks split-and-print</text>

  <!-- vault -->
  <rect x="960" y="200" width="240" height="170" rx="10" fill="#13131c" stroke="#24242f" stroke-width="1.5"/>
  <text x="985" y="245" font-family="Georgia, serif" font-size="26" fill="#e8d5ac">Vault</text>
  <text x="985" y="280" font-size="15" fill="#9c9cab">full-record replace,</text>
  <text x="985" y="306" font-size="15" fill="#9c9cab">no partial update</text>
  <text x="985" y="338" font-size="15" fill="#6f6752">record holds the secret</text>

  <!-- return path -->
  <rect x="470" y="460" width="360" height="90" rx="10" fill="#13131c" stroke="#24242f" stroke-width="1.5"/>
  <text x="495" y="500" font-size="17" fill="#f0ebe1">Back to the model: ok / failed</text>
  <text x="495" y="530" font-size="15" fill="#9c9cab">output sanitized, no echo of values</text>

  <!-- arrows -->
  <line x1="340" y1="285" x2="470" y2="285" stroke="#cfae70" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <text x="405" y="268" text-anchor="middle" font-size="15" fill="#cfae70">placeholder</text>

  <line x1="830" y1="285" x2="960" y2="285" stroke="#cfae70" stroke-width="1.6" marker-end="url(#arrowB)"/>
  <text x="895" y="268" text-anchor="middle" font-size="15" fill="#cfae70">inside pipe</text>

  <path d="M650 370 L650 460" stroke="#9c9cab" stroke-width="1.5" fill="none" marker-end="url(#arrowB)"/>
  <text x="670" y="425" font-size="15" fill="#9c9cab">sanitized result</text>

  <!-- blocked split attempt -->
  <path d="M200 400 L200 545 L470 545" stroke="#e06c60" stroke-width="1.6" fill="none" stroke-dasharray="7 5" marker-end="url(#arrowR)"/>
  <text x="215" y="575" font-size="15" fill="#e06c60">split the pipe and print: denied before execution</text>

  <text x="700" y="625" text-anchor="middle" font-size="16" fill="#6f6752">process discipline is not enforcement; the wrapper and the deny rule are</text>
</svg>
