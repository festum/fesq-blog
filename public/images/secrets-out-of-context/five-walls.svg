<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#e06c60" stroke-width="1.6"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#cfae70" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1400" height="800" fill="#0a0a0d"/>

  <text x="700" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="42" fill="#f0ebe1">Five walls around the context</text>
  <text x="700" y="112" text-anchor="middle" font-size="19" fill="#9c9cab">the secret stops at wall one; intent and placeholders travel through</text>

  <!-- five concentric walls, 45px bands, center box last -->
  <rect x="110" y="148" width="1140" height="604" rx="14" fill="none" stroke="#cfae70" stroke-width="2.5"/>
  <rect x="155" y="193" width="1050" height="514" rx="12" fill="none" stroke="#b99a63" stroke-width="2"/>
  <rect x="200" y="238" width="960" height="424" rx="10" fill="none" stroke="#8f7a4e" stroke-width="2"/>
  <rect x="245" y="283" width="870" height="334" rx="8" fill="none" stroke="#5f563f" stroke-width="2"/>
  <rect x="290" y="328" width="780" height="244" rx="8" fill="none" stroke="#3d3a30" stroke-width="2"/>
  <rect x="335" y="373" width="690" height="154" rx="8" fill="#13131c" stroke="#24242f" stroke-width="2"/>

  <!-- wall labels, each inside its own top band -->
  <text x="128" y="178" font-size="17" fill="#cfae70">1 · Gateway virtual keys</text>
  <text x="173" y="223" font-size="17" fill="#b99a63">2 · Harness deny floor</text>
  <text x="218" y="268" font-size="17" fill="#8f7a4e">3 · Scrubbed environment</text>
  <text x="263" y="313" font-size="17" fill="#6f6752">4 · Redacted exits</text>
  <text x="308" y="358" font-size="17" fill="#5f563f">5 · Human gates</text>

  <!-- center: context window -->
  <text x="680" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#e8d5ac">context window</text>
  <text x="680" y="466" text-anchor="middle" font-size="17" fill="#9c9cab">intent + placeholders, never values</text>
  <text x="680" y="496" text-anchor="middle" font-size="15" fill="#6f6752">10 virtual keys guard 18 upstream keys</text>

  <!-- blocked secret arrow, labels right-aligned clear of wall one (x=110) -->
  <line x1="24" y1="300" x2="100" y2="300" stroke="#e06c60" stroke-width="2.5" marker-end="url(#arrowW)"/>
  <text x="96" y="278" text-anchor="end" font-size="17" fill="#e06c60">secret</text>
  <text x="96" y="330" text-anchor="end" font-size="15" fill="#e06c60">stops here</text>

  <!-- outbound: intent + placeholder leave the context through every wall -->
  <line x1="1030" y1="435" x2="1345" y2="435" stroke="#cfae70" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <text x="1395" y="422" text-anchor="end" font-size="15" fill="#cfae70">intent out</text>

  <!-- inbound: sanitized result returns -->
  <line x1="1345" y1="478" x2="1027" y2="478" stroke="#9c9cab" stroke-width="1.8" marker-end="url(#arrowG)"/>
  <text x="1395" y="503" text-anchor="end" font-size="15" fill="#9c9cab">sanitized ok</text>

  <!-- bottom legend -->
  <text x="700" y="784" text-anchor="middle" font-size="16" fill="#6f6752">deny rules and human gates run in code: a wrong answer from the model cannot change the outcome</text>
</svg>
