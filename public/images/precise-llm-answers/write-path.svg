<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#cfae70" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1400" height="800" fill="#0a0a0d"/>
  <text x="700" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="46" fill="#f0ebe1">Where the precision is bought</text>
  <text x="700" y="124" text-anchor="middle" font-size="19" fill="#9c9cab">the write path runs paid; the read path runs free</text>

  <!-- retain -->
  <rect x="60" y="190" width="300" height="150" rx="10" fill="#13131c" stroke="#24242f" stroke-width="1.5"/>
  <text x="85" y="235" font-family="Georgia, serif" font-size="28" fill="#e8d5ac">Retain</text>
  <text x="85" y="268" font-size="15" fill="#9c9cab">~3,000-char chunks, one</text>
  <text x="85" y="291" font-size="15" fill="#9c9cab">LLM extraction each</text>
  <text x="85" y="318" font-size="15" fill="#9c9cab">entity resolve → write txn → ANN</text>

  <!-- consolidation -->
  <rect x="440" y="190" width="340" height="150" rx="10" fill="#13131c" stroke="#cfae70" stroke-width="1.5"/>
  <text x="465" y="235" font-family="Georgia, serif" font-size="28" fill="#e8d5ac">Consolidation</text>
  <text x="465" y="268" font-size="15" fill="#9c9cab">≤100 memories per round</text>
  <text x="465" y="291" font-size="15" fill="#9c9cab">sub-batches, bisected on failure</text>
  <text x="465" y="318" font-size="15" fill="#9c9cab">checkpoints; banks yield the slot</text>

  <!-- observations -->
  <rect x="860" y="190" width="300" height="150" rx="10" fill="#13131c" stroke="#24242f" stroke-width="1.5"/>
  <text x="885" y="235" font-family="Georgia, serif" font-size="28" fill="#e8d5ac">Observations</text>
  <text x="885" y="268" font-size="15" fill="#9c9cab">dedup at cosine 0.97</text>
  <text x="885" y="291" font-size="15" fill="#9c9cab">quotes + proof counts</text>
  <text x="885" y="318" font-size="15" fill="#9c9cab">refined, never overwritten</text>

  <!-- mental models -->
  <rect x="1180" y="190" width="170" height="150" rx="10" fill="#13131c" stroke="#24242f" stroke-width="1.5"/>
  <text x="1200" y="235" font-family="Georgia, serif" font-size="26" fill="#e8d5ac">Mental</text>
  <text x="1200" y="266" font-family="Georgia, serif" font-size="26" fill="#e8d5ac">models</text>
  <text x="1200" y="300" font-size="15" fill="#9c9cab">precomputed,</text>
  <text x="1200" y="322" font-size="15" fill="#9c9cab">DB-read</text>

  <g stroke="#9c9cab" stroke-width="1.3" fill="none">
    <path d="M360 265 L440 265" marker-end="url(#arrow2)"/>
    <path d="M780 265 L860 265" marker-end="url(#arrow2)"/>
    <path d="M1160 265 L1180 265" marker-end="url(#arrow2)"/>
  </g>

  <!-- ladder down -->
  <path d="M1265 340 L1265 430" stroke="#cfae70" stroke-width="1.3" fill="none" marker-end="url(#arrow2)"/>
  <text x="1265" y="405" text-anchor="middle" font-size="15" fill="#cfae70">read ladder</text>
  <rect x="60" y="440" width="1290" height="90" rx="10" fill="#13131c" stroke="#24242f" stroke-width="1.5"/>
  <text x="90" y="480" font-size="20" fill="#f0ebe1">recall climbs cheapest first: mental model → observations → raw facts</text>
  <text x="90" y="508" font-size="15" fill="#9c9cab">reflect capped at 12 LLM calls / 100K tokens / 5 min — the ladder is why a hard question stays bounded</text>

  <!-- measured bill -->
  <rect x="60" y="580" width="1290" height="170" rx="10" fill="#13131c" stroke="#24242f" stroke-width="1.5"/>
  <text x="90" y="620" font-family="Georgia, serif" font-size="26" fill="#e8d5ac">The bill, two days, 2,177 calls</text>
  <g font-size="17">
    <text x="90" y="658" fill="#f0ebe1">consolidation</text>
    <rect x="300" y="644" width="620" height="18" fill="#cfae70"/>
    <text x="935" y="659" fill="#9c9cab">1,400 calls · 4.83M tokens</text>
    <text x="90" y="694" fill="#f0ebe1">mental-model refresh</text>
    <rect x="300" y="680" width="445" height="18" fill="#cfae70" opacity="0.75"/>
    <text x="760" y="695" fill="#9c9cab">482 calls · 3.49M tokens</text>
    <text x="90" y="730" fill="#f0ebe1">retain</text>
    <rect x="300" y="716" width="55" height="18" fill="#9c9cab"/>
    <text x="370" y="731" fill="#9c9cab">104 calls · 422K tokens</text>
    <text x="700" y="731" fill="#f0ebe1">recall</text>
    <rect x="775" y="716" width="8" height="18" fill="#9c9cab" opacity="0.6"/>
    <text x="800" y="731" fill="#9c9cab">181 calls · 4.8K tokens · zero LLM</text>
  </g>
</svg>
